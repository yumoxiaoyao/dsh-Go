name: Build clone APK
on: workflow_dispatch
permissions: {contents: read}
jobs:
  b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          k=app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/a11y
          sed -i 's/minOpacity = 0\.3;/minOpacity = 0.0;/' app/lib/phone/phone_channel.dart
          sed -i 's/this\.min = 30,/this.min = 0,/' app/lib/ui/phone/phone_widgets.dart
          sed -i 's/MIN_OPACITY = 0\.3f/MIN_OPACITY = 0f/' $k/OverlayPrefs.kt
          sed -i 's|^        view.setLook(dark, seed)$|        if (true) return false\n        view.setLook(dark, seed)|' $k/EdgeBeam.kt
          f=runtime/build-runtime.sh
          sed -i -e 's|mirrors.tuna.tsinghua.edu.cn/ubuntu-cdimage|cdimage.ubuntu.com|' -e 's|mirrors.tuna.tsinghua.edu.cn/ubuntu-ports|ports.ubuntu.com|' -e 's|mirrors.tuna.tsinghua.edu.cn/ubuntu|archive.ubuntu.com/ubuntu|' -e 's|npmmirror.com/mirrors/node|nodejs.org/dist|' -e 's|registry.npmmirror.com|registry.npmjs.org|g' $f
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: 3.47.7}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - run: printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > app/android/local.properties
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" || true
      - run: cd app/android && gradle wrapper --gradle-version 9.3.1
      - run: bash runtime/build-runtime.sh arm64-v8a
      - run: |
          set -o pipefail
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 2>&1 | tee build.log
      - if: always()
        run: tail -50 build.log >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-opacity
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
