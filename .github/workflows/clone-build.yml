name: Build clone APK
on: workflow_dispatch
permissions:
  contents: read
env:
  GRADLE_VERSION: 9.3.1
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          sed -i 's/static const minOpacity = 0\.3;/static const minOpacity = 0.0;/' app/lib/phone/phone_channel.dart
          sed -i 's/this\.min = 30,/this.min = 0,/' app/lib/ui/phone/phone_widgets.dart
          sed -i 's/MIN_OPACITY = 0\.3f/MIN_OPACITY = 0f/' app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/a11y/OverlayPrefs.kt
          sed -i 's|^        view.setLook(dark, seed)$|        if (true) return false\n        view.setLook(dark, seed)|' app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/a11y/EdgeBeam.kt
          grep -n 'return false' app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/a11y/EdgeBeam.kt
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd file gpgv xz-utils unzip python3 curl
          bash tooling/setup-toolchain.sh
      - name: Gradle wrapper
        run: |
          source tooling/env.sh
          cd app/android && gradle wrapper --gradle-version "$GRADLE_VERSION"
      - name: Runtime
        run: |
          source tooling/env.sh
          bash runtime/build-runtime.sh arm64-v8a
      - name: Build APK
        run: |
          source tooling/env.sh
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-opacity
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
